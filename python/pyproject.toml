[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "not-jwt"
version = "1.0.0"
description = "Tiny HMAC-SHA256 message signer, token-compatible with the not-jwt npm package."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Ibrahim Rafi" }]
keywords = ["hmac", "jwt", "signature", "token", "crypto"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Security :: Cryptography",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/rafiibrahim8/not-jwt"
Source = "https://github.com/rafiibrahim8/not-jwt/tree/main/python"
