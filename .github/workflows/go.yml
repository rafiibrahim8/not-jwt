name: Go

on:
  push:
    branches:
      - main
    paths:
      - "go/**"
      - "testdata/**"
      - ".github/workflows/go.yml"
  pull_request:
    paths:
      - "go/**"
      - "testdata/**"
      - ".github/workflows/go.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        go-version: ["1.21", "stable"]
    defaults:
      run:
        working-directory: go
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: go/go.mod

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...
