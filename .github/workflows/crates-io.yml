name: Publish to crates.io

on:
  push:
    tags:
      - "rust/v*"
  workflow_dispatch:

concurrency:
  group: crates-io-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        run: rustup toolchain install stable --profile minimal

      - name: Run tests
        run: cargo test --locked

      - name: Read crate name and version
        id: crate
        run: |
          META="$(cargo metadata --no-deps --format-version 1)"
          echo "name=$(echo "$META" | jq -r '.packages[0].name')" >> "$GITHUB_OUTPUT"
          echo "version=$(echo "$META" | jq -r '.packages[0].version')" >> "$GITHUB_OUTPUT"

      - name: Verify tag version matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/rust/v}"
          if [ "$TAG" != "${{ steps.crate.outputs.version }}" ]; then
            echo "Tag rust/v$TAG does not match Cargo.toml version ${{ steps.crate.outputs.version }}"
            exit 1
          fi

      - name: Check if version already exists on crates.io
        id: version_check
        run: |
          NAME="${{ steps.crate.outputs.name }}"
          VERSION="${{ steps.crate.outputs.version }}"
          STATUS="$(curl -s -o /dev/null -w "%{http_code}" \
            -A "not-jwt-publish (https://github.com/${{ github.repository }})" \
            "https://crates.io/api/v1/crates/${NAME}/${VERSION}")"
          if [ "$STATUS" = "200" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "${NAME}@${VERSION} already exists on crates.io. Skipping publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to crates.io
        if: steps.version_check.outputs.exists == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
